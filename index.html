    <div class="container my-4">

        <h1 class="h3">Produtos</h1>
        <p>Cadastrar, consultar, alterar e excluir os itens de doação ou troca.</p>
        <hr>

        <!-- LISTA (o Javascript preenche aqui) -->
        <div id="lista"></div>

        <!-- FORMULÁRIO (serve para cadastrar e para alterar) -->
        <br></br>
        <br></br>
        <br></br>


        <h1 class="h3">Cadastro de Produtos</h1>
        <hr>
        <input type="hidden" id="id">

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="descricao" class="form-label">Descrição</label>
                <input type="text" id="descricao" class="form-control">
            </div>
            <div class="col-md-4">
                <label for="estado" class="form-label">Estado de conservação</label>
                <select id="estado" class="form-select">
                    <option>Novo</option>
                    <option>Seminovo</option>
                    <option>Usado</option>
                    <option>Desgastado</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="tipo" class="form-label">Tipo de negociação</label>
                <select id="tipo" class="form-select">
                    <option>Doação</option>
                    <option>Troca</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select">
                    <option>Disponível</option>
                    <option>Reservado</option>
                    <option>Concluído</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="localizacao" class="form-label">Localização</label>
                <input type="text" id="localizacao" class="form-control">
            </div>
            <div class="col-md-4">
                <label for="visivel" class="form-label">Localização visível?</label>
                <select id="visivel" class="form-select">
                    <option value="1">Sim</option>
                    <option value="0">Não</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="data" class="form-label">Data de publicação</label>
                <input type="date" id="data" class="form-control">
            </div>
            <div class="col-md-4">
                <label for="categoria" class="form-label">Categoria</label>
                <select id="categoria" class="form-select"></select>
            </div>
            <div class="col-md-4">
                <label for="usuario" class="form-label">Publicador</label>
                <select id="usuario" class="form-select"></select>
            </div>
            <div class="col-md-4">
                <label for="fotos" class="form-label">Foto (link)</label>
                <input type="text" id="fotos" class="form-control">
            </div>
        </div>

        <button id="enviar" class="btn btn-primary">Salvar</button>
        <button id="cancelar" class="btn btn-outline-secondary">Limpar</button>
        <hr>

        

    </div>

    <script src="js/produtos/produtos.js"></script>
