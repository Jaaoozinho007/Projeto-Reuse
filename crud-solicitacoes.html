<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Solicitações — ReUse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="css/style.css">

  <link rel="icon" href="./icone.png">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-eco d-none d-lg-block">
  <div class="container">

    <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
      <span class="brand-mark">
        <i class="bi bi-arrow-repeat"></i>
      </span>

      <span class="brand-name">ReUse</span>
    </a>

    <ul class="navbar-nav flex-row gap-1">

      <li class="nav-item">
        <a class="nav-link nav-link-eco" href="index.html">
          <i class="bi bi-box-seam me-1"></i>Itens
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link nav-link-eco active" href="crud-solicitacoes.html">
          <i class="bi bi-hand-thumbs-up me-1"></i>Solicitações
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link nav-link-eco" href="crud-avaliacoes.html">
          <i class="bi bi-star me-1"></i>Avaliações
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link nav-link-eco" href="crud-campanhas.html">
          <i class="bi bi-megaphone me-1"></i>Campanhas
        </a>
      </li>

    </ul>
  </div>
</nav>

<nav class="navbar navbar-eco d-lg-none">
  <div class="container">
    <span class="fw-semibold">Solicitações</span>
  </div>
</nav>


<div class="container my-4">

  <div class="d-flex align-items-center gap-3 mb-4">

    <div class="page-header-icon bg-primary-light">
      ✓
    </div>

    <div>
      <h1 class="h4 mb-0">Solicitações de itens</h1>

      <p class="text-muted-eco small mb-0">
        Criar, visualizar, editar e excluir pedidos feitos sobre um item.
      </p>
    </div>

  </div>


  <div class="table-responsive bg-surface border rounded-4 p-2 mb-4"
       style="border-color:var(--color-border) !important;">

    <table class="table table-eco mb-0">

      <thead>
        <tr>
          <th>Item</th>
          <th>Solicitante</th>
          <th>Local sugerido</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="listaSolicitacoes">

        <tr id="semSolicitacoes">

          <td colspan="5" class="text-center text-muted-eco py-4">
            Nenhuma solicitação cadastrada.
          </td>

        </tr>

      </tbody>

    </table>

  </div>



  <div class="bg-surface border rounded-4 p-4 mb-4"
       style="border-color:var(--color-border) !important;">

    <h2 class="h5 mb-4">
      Nova solicitação
    </h2>


    <form id="formSolicitacao">



      <div class="mb-3">

        <label class="form-label-eco">
          Item desejado
        </label>

        <select id="item" class="form-select form-select-eco">

          <option value="" selected disabled>
            Selecione um item
          </option>

          <option>Monitor LG 19"</option>
          <option>Estante de madeira</option>
          <option>Livros de cálculo (5un)</option>
          <option>Jaqueta jeans M</option>
          <option>Notebook Dell</option>
          <option>Cadeira de escritório</option>
          <option>Bicicleta aro 26</option>
          <option>Celular Samsung</option>
          <option>Mochila</option>
          <option>Teclado</option>
          <option>Mouse</option>
          <option>Fone de ouvido</option>
          <option>Calculadora</option>
          <option>Impressora</option>
          <option>Armário</option>
          <option>Mesa de escritório</option>
          <option>Livros</option>
          <option>Material escolar</option>
          <option>Roupas</option>
          <option>Calçados</option>

        </select>

      </div>


      <div class="mb-3">

        <label class="form-label-eco">
          Seu nome
        </label>

        <input
          id="nome"
          type="text"
          class="form-control form-control-eco"
          placeholder="Ex: Rafael Furlan"
        >

      </div>



      <div class="mb-3">

        <label class="form-label-eco">
          Mensagem para o doador
        </label>

        <textarea
          id="mensagem"
          class="form-control form-control-eco"
          rows="3"
          placeholder="Olá! Tenho interesse no item, posso retirar amanhã à tarde."
        ></textarea>

      </div>


      <div class="mb-3">

        <label class="form-label-eco">
          Local de retirada sugerido
        </label>

        <select id="local" class="form-select form-select-eco">

          <option value="" selected disabled>
            Selecione um local
          </option>

          <option>Portaria do Bloco B</option>
          <option>Biblioteca central</option>
          <option>A combinar por mensagem</option>

        </select>

      </div>

      <div class="mb-3">

        <label class="form-label-eco">
          Status
        </label>

        <select id="status" class="form-select form-select-eco">

          <option value="" selected disabled>
            Selecione um status
          </option>

          <option>Pendente</option>
          <option>Aceita</option>
          <option>Recusada</option>

        </select>

      </div>


      <div class="d-flex gap-2">

        <button
          type="reset"
          class="btn-eco-outline flex-fill"
        >
          Limpar
        </button>

        <button
          type="submit"
          class="btn-eco flex-fill"
        >
          Salvar solicitação
        </button>

      </div>

    </form>

  </div>

</div>


<script src="/js/solicitacoes.js"></script>

</body>
</html>
